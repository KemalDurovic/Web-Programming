<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelTrust - Login & Register</title>
    <link rel="stylesheet" href="../assets/css/authentication.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo-text">TravelTrust</div>
                <p class="auth-subtitle">Your journey begins here</p>
            </div>

            <div class="auth-body">
                <div class="form-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>

                <!-- Login Form -->
                <div class="form-content active" id="login">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="login-email">Email Address</label>
                            <input type="email" id="login-email" required placeholder="john@example.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" required placeholder="••••••••">
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox"> Remember me
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="btn-submit">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="form-content" id="register">
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="register-name">Full Name</label>
                            <input type="text" id="register-name" required placeholder="John Doe">
                        </div>

                        <div class="form-group">
                            <label for="register-email">Email Address</label>
                            <input type="email" id="register-email" required placeholder="john@example.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="register-password">Password</label>
                            <input type="password" id="register-password" required placeholder="••••••••">
                        </div>

                        <div class="form-group">
                            <label for="register-confirm">Confirm Password</label>
                            <input type="password" id="register-confirm" required placeholder="••••••••">
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox" required> I agree to Terms & Conditions
                            </label>
                        </div>
                        
                        <button type="submit" class="btn-submit">Create Account</button>
                    </form>
                </div>

                <div class="auth-footer">
                    <a href="../index.html" class="back-link">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/authentication.js"></script>
</body>
</html>
