    <div class="admin-wrapper">
        <div class="admin-container">
            <div class="admin-header">
                <div class="header-gradient">
                    <h1>TravelTrust Admin Panel</h1>
                    <p>Manage destinations and travel packages</p>
                </div>
                <div class="admin-tabs">
                    <button class="admin-tab active" onclick="switchTab('admin-destinations')">Destinations</button>
                    <button class="admin-tab" onclick="switchTab('admin-packages')">Packages</button>
                </div>
            </div>
            <div class="smth-content active" id="admin-destinations">
                <div class="form-section">
                    <h2 class="form-title">Add New Destination</h2>
                    <div class="success-alert" id="destination-success" style="display: none;">
                        Destination added successfully!
                    </div>
                    <form id="destination-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Destination Name</label>
                                <input type="text" class="form-input" id="dest-name" placeholder="Swiss Alps" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Location</label>
                                <input type="text" class="form-input" id="dest-location" placeholder="Switzerland" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Category Badge</label>
                                <select class="form-select" id="dest-category" required>
                                    <option value="">Select Category</option>
                                    <option value="popular">Popular</option>
                                    <option value="trending">Trending</option>
                                    <option value="cultural">Cultural</option>
                                    <option value="adventure">Adventure</option>
                                    <option value="winter">Winter</option>
                                    <option value="safari">Safari</option>
                                    <option value="summer">Summer</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Price (From)</label>
                                <input type="number" class="form-input" id="dest-price" placeholder="1299" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-input" id="dest-image" placeholder="https://example.com/image.jpg" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea class="form-textarea" id="dest-description" placeholder="Majestic mountains, pristine lakes, and charming villages await you." required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Add Destination</button>
                    </form>
                </div>
            </div>

            <!-- Packages Content -->
            <div class="smth-content" id="admin-packages">
                <div class="form-section">
                    <h2 class="form-title">Add New Package</h2>
                    <div class="success-alert" id="package-success" style="display: none;">
                        Package added successfully!
                    </div>
                    <form id="package-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Package Name</label>
                                <input type="text" class="form-input" id="pkg-name" placeholder="Alpine Explorer" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Duration</label>
                                <input type="text" class="form-input" id="pkg-duration" placeholder="7 Days / 6 Nights" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <select class="form-select" id="pkg-category" required>
                                    <option value="">Select Category</option>
                                    <option value="adventure">Adventure</option>
                                    <option value="beach">Beach</option>
                                    <option value="cultural">Cultural</option>
                                    <option value="luxury">Luxury</option>
                                    <option value="City & Night life">City & Night life</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Destination</label>
                                <select class="form-select" id="pkg-destination" required>
                                    <option value="">Select Destination</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ribbon Badge</label>
                                <select class="form-select" id="pkg-ribbon">
                                    <option value="">None</option>
                                    <option value="Best Seller">Best Seller</option>
                                    <option value="Premium">Premium</option>
                                    <option value="Exclusive">Exclusive</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Features (one per line)</label>
                            <textarea class="form-textarea" id="pkg-features" placeholder="Mountain hiking tours&#10;Cable car experiences&#10;Local cuisine tasting&#10;Professional guide" required></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Add Package</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
