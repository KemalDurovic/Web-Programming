<section id="packages" class="section packages">
    <div class="section-container">
        <div class="section-header">
            <h2 class="section-title">Travel Packages</h2>
            <p class="section-subtitle">Carefully curated packages designed for unforgettable experiences.</p>
        </div>
        
        <div class="packages-tabs">
            <button class="package-tab active" data-category="all">All Packages</button>
            <button class="package-tab" data-category="adventure">Adventure</button>
            <button class="package-tab" data-category="beach">Beach</button>
            <button class="package-tab" data-category="cultural">Cultural</button>
            <button class="package-tab" data-category="luxury">Luxury</button>
        </div>

        <div class="packages-grid">
        </div>
    </div>

    <div id="bookingModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Book Your Package</h2>
            
            <form id="bookingForm">
                <input type="hidden" id="booking_id">
                <input type="hidden" id="booking_package_id">
                <input type="hidden" id="booking_total_price">
                
                <div class="form-group">
                    <label for="booking_date">Travel Date</label>
                    <input type="date" id="booking_date" required>
                </div>
                
                <div class="form-group">
                    <label for="number_of_people">Number of People</label>
                    <input type="number" id="number_of_people" min="1" value="1" required>
                </div>
                
                <div class="form-group">
                    <label for="special_requests">Special Requests (Optional)</label>
                    <textarea id="special_requests" rows="3" placeholder="Any special requirements or requests..."></textarea>
                </div>
                
                <button type="button" id="submitBooking" class="btn-primary full-width">Confirm Booking</button>
            </form>
        </div>
    </div> 
</section>

<script>
$(document).ready(function() {
    if (typeof PackageService !== 'undefined') {
        PackageService.init();
    }
    if (typeof BookingService !== 'undefined') {
        BookingService.init();
    }
});
</script>
