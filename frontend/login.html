<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelTrust - Login & Register</title>
    <link rel="stylesheet" href="assets/css/authentication.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo-text">TravelTrust</div>
                <p class="auth-subtitle">Your journey begins here</p>
            </div>

            <div class="auth-body">
                <div class="form-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>

                <!-- Login Form -->
                <div class="form-content active" id="login">
                    <form id="login-form">
                        <div class="form-group">
                            <label for="login-email">Email Address</label>
                            <input type="email" name="email" id="login-email" required placeholder="john@example.com">
                        </div>
                        
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" name="password" id="login-password" required placeholder="••••••••">
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox"> Remember me
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>
                        
                        <button type="submit" class="btn-submit">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="form-content" id="register">
    <form id="register-form">
        <div class="form-group">
            <label for="register-username">Username</label>
            <input type="text" name="username" id="register-username" required placeholder="johndoe">
        </div>

        <div class="form-group">
            <label for="register-name">Full Name</label>
            <input type="text" name="full_name" id="register-name" required placeholder="John Doe">
        </div>

        <div class="form-group">
            <label for="register-email">Email Address</label>
            <input type="email" name="email" id="register-email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
            <label for="register-phone">Phone Number</label>
            <input type="tel" name="phone" id="register-phone" placeholder="+387 61 234 567">
        </div>
        
        <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" name="password" id="register-password" required placeholder="••••••••">
        </div>

        <div class="form-group">
            <label for="register-confirm">Confirm Password</label>
            <input type="password" name="password_confirm" id="register-confirm" required placeholder="••••••••">
        </div>

        <div class="form-options">
            <label class="checkbox-label">
                <input type="checkbox" required> I agree to Terms & Conditions
            </label>
        </div>
        
        <button type="submit" class="btn-submit">Create Account</button>
    </form>
</div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-header">
                <h2>Reset Password</h2>
                <p>Enter your email address and new password</p>
            </div>
            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="reset-email">Email Address</label>
                    <input type="email" name="email" id="reset-email" required placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" name="new_password" id="new-password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="confirm-new-password">Confirm New Password</label>
                    <input type="password" name="confirm_password" id="confirm-new-password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn-submit">Reset Password</button>
            </form>
        </div>
    </div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>

<script src="utils/constant.js"></script>
<script src="utils/Utils.js"></script>
<script src="services/user-service.js"></script>

<script src="assets/js/authentication.js"></script>
<script src="services/login-service.js"></script>
</style>
</body>
</html>
